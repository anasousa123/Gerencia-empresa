<!DOCTYPE html>
<html lang="pt-BR">

<head>

<title>Nexus ERP</title>

<link rel="stylesheet" href="css/layout.css">

</head>

<body>

        <div class="logo">

            <i class="fa-solid fa-chart-line"></i>

                <h2>Nexus ERP</h2>

            </div>

        </div>

        <div class="menu-title">

            MENU

        </div>

        <nav>

            <a class="ativo" href="dashboard.html">

                <i class="fa-solid fa-house"></i>

                <span>Dashboard</span>

            </a>

            <a href="pages/produtos.html">

                <i class="fa-solid fa-box"></i>

                <span>Produtos</span>

            </a>

            <a href="pages/estoque.html">

                <i class="fa-solid fa-warehouse"></i>

                <span>Estoque</span>

            </a>

            <a href="pages/vendas.html">

                <i class="fa-solid fa-cart-shopping"></i>

            </a>

                <span>Clientes</span>

            </a>

            <a href="pages/fornecedores.html">

                <i class="fa-solid fa-truck"></i>

                <span>Fornecedores</span>

            </a>

            <a href="pages/financeiro.html">

                <i class="fa-solid fa-wallet"></i>

                <span>Financeiro</span>

            </a>

            <a href="pages/relatorios.html">

                <i class="fa-solid fa-chart-pie"></i>

                <span>Relatórios</span>

            </a>

            <a href="pages/configuracoes.html">

                <span>Configurações</span>

    <main class="main">

        <header class="topbar">

            <div class="pesquisa">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input type="text" placeholder="Pesquisar...">

            </div>

            <div class="top-right">

                <button>

                </button>

                <button>

                    <i class="fa-regular fa-envelope"></i>

                </button>

                <div class="perfil">

                    <img src="https://i.pravatar.cc/150?img=12">

                    <div>

                        <strong>Ana Sousa</strong>

                        <small>Administrador</small>

                    </div>

                </div>

            </div>

        </header>

        <!-- Conteúdo -->

        <section class="conteudo">

            <h1>Bem-vinda ao Nexus ERP 👋</h1>

            <p>

                Aqui será carregado o Dashboard e todas as páginas do sistema.

            </p>

<script src="js/layout.js"></script>
